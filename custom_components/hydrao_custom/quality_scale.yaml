# Integration Quality Scale status for Hydrao Custom.
#
# Rule list: https://developers.home-assistant.io/docs/core/integration-quality-scale/rules
#
# Every status below was assessed against the repository itself, not
# assumed. `todo` means the requirement is not met yet; `exempt` means it
# does not apply, with the reason given in the comment.
#
# manifest.json declares "quality_scale": "platinum": every rule below, from
# Bronze to Platinum, is done or exempt, and none is todo.
#
# This level is self-declared. hassfest only validates this file for core
# integrations and skips custom ones. The rules that hassfest can check
# automatically (config-flow, unique-config-entry, runtime-data, discovery)
# were run against this integration with hassfest's own validators and pass.
#
# A few statuses are checked against the code by tests/test_quality_scale.py,
# so this file cannot silently drift from what the repository really does:
# test-coverage is tied to the threshold enforced by the Tests workflow, and
# strict-typing to the `mypy --strict` step of the Typing workflow.
rules:
  # --- Bronze ---------------------------------------------------------------
  action-setup:
    status: exempt
    comment: The integration registers no service actions.
  appropriate-polling:
    status: done
    comment: >-
      No DataUpdateCoordinator polling (update_interval=None). A BLE session
      is only opened while the device advertises, i.e. while water flows, and
      reads cycle about every 0.3 s for as long as the connection lasts.
  brands:
    status: done
    comment: >-
      Ships brand/icon.png and brand/logo.png. The two files are currently
      byte-identical; a dedicated wide logo would be better.
  common-modules:
    status: done
    comment: >-
      coordinator.py holds the data handling and entity.py holds HydraoEntity,
      the base class of every entity (translated names, unique id from the
      Bluetooth address, device_info).
  config-flow-test-coverage:
    status: done
    comment: >-
      config_flow.py is at 100% (lines and branches). Covered: setup by the
      user and by Bluetooth discovery, each error followed by a recovery,
      refusal of duplicates, and the options flow (where the values come
      from, saving, factory reset and every refused submission).
  config-flow:
    status: done
    comment: >-
      Set up via the UI by Bluetooth discovery or manual MAC entry, with a
      description for every field of both steps (data_description).
  dependency-transparency:
    status: exempt
    comment: >-
      The manifest declares no requirements of its own: bleak and
      bleak-retry-connector come with Home Assistant's Bluetooth integration,
      which this one depends on. The BLE protocol itself lives in this
      repository.
  docs-actions:
    status: exempt
    comment: The integration provides no service actions.
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description:
    status: done
    comment: README sections "At a Glance" and "Why This Integration?".
  docs-installation-instructions:
    status: done
    comment: README section "Installation" (HACS and manual) and requirements.
  docs-removal-instructions:
    status: done
    comment: README sections "Removal" and "Suppression de l'intégration".
  entity-event-setup:
    status: done
    comment: >-
      Entities are CoordinatorEntity subclasses; the RSSI sensor subscribes in
      async_added_to_hass and unsubscribes through async_on_remove.
  entity-unique-id:
    status: done
    comment: All entity classes set a unique id built from the MAC address.
  has-entity-name:
    status: done
    comment: All entity classes set _attr_has_entity_name = True.
  runtime-data:
    status: done
    comment: >-
      Uses entry.runtime_data, typed through the HydraoConfigEntry alias
      declared in const.py.
  test-before-configure:
    status: exempt
    comment: >-
      The device only advertises while water is running, so a connection
      cannot be tested when the user sets it up. The MAC format is validated.
  test-before-setup:
    status: exempt
    comment: >-
      Setup must succeed while the device is asleep, which is its normal
      state. The BLE loop runs as a background task and retries by itself.
  unique-config-entry:
    status: done
    comment: >-
      The MAC address is the unique id in both the bluetooth and user flows,
      and _abort_if_unique_id_configured() is called.

  # --- Silver ---------------------------------------------------------------
  action-exceptions:
    status: exempt
    comment: >-
      No service actions. The button, number and switch entities only change
      local state; writes to the device are queued and sent on the next
      connection, so a press cannot fail on the spot.
  config-entry-unloading:
    status: done
    comment: >-
      async_unload_entry unloads the platforms; the options listener, the
      Bluetooth listener and the BLE loop task are all bound to the entry.
  docs-configuration-parameters:
    status: done
    comment: README section "Options".
  docs-installation-parameters:
    status: done
    comment: >-
      README section "Configuration" describes the MAC address and the
      minimum comfort temperature asked at setup.
  entity-unavailable:
    status: exempt
    comment: >-
      Design choice: the device is unreachable most of the time (it only
      talks while water runs), so session sensors keep their last values and
      the Bluetooth status sensor exposes the link state. The RSSI sensor is
      already unavailable whenever there is no live connection.
  integration-owner:
    status: done
    comment: manifest.json lists @Adrien40 as codeowner.
  log-when-unavailable:
    status: exempt
    comment: >-
      Being offline is the device's normal state; logging each transition
      would produce noise on every shower. Failures that matter (connection
      error with the device in range, failed config write) are logged.
  parallel-updates:
    status: done
    comment: >-
      PARALLEL_UPDATES is defined on every platform: 0 for the read-only
      sensors, 1 for button, number and switch (their writes are queued
      locally and sent on the next BLE connection).
  reauthentication-flow:
    status: exempt
    comment: The integration has no authentication.
  test-coverage:
    status: done
    comment: >-
      Every module of the integration is covered at 100% (lines and
      branches), well above the 95% the rule asks for, and the Tests workflow
      fails the build below 95% (see .coveragerc). The BLE layer is tested
      with a scripted fake client (tests/helpers.py), so connection cycles,
      config writes, the "new shower" reboot and the background loop run
      without any radio; entities and services are driven through Home
      Assistant itself (the `integration` fixture in tests/conftest.py).

  # --- Gold -----------------------------------------------------------------
  devices:
    status: done
    comment: One device per entry, with identifiers, firmware, hardware and serial.
  diagnostics:
    status: done
    comment: >-
      diagnostics.py returns the entry data and options plus the coordinator
      state (Bluetooth status, pending writes, last data and the last raw
      Bluetooth frames). The Bluetooth address, name and device id are
      redacted; tests/test_diagnostics.py checks that none of them leaks.
  discovery-update-info:
    status: exempt
    comment: >-
      A Bluetooth address is the device's identity and does not change, so
      there is no network information to update from discovery.
  discovery:
    status: done
    comment: >-
      manifest.json declares a bluetooth matcher (local_name HYDRAO*) and the
      config flow implements async_step_bluetooth.
  docs-data-update:
    status: done
    comment: README section "How Data Is Updated".
  docs-examples:
    status: done
    comment: README section "Automation Examples".
  docs-known-limitations:
    status: done
    comment: README section "Known Limitations".
  docs-supported-devices:
    status: done
    comment: README section "Compatibility / Requirements" (HYDRAO* models, tested on Aloe).
  docs-supported-functions:
    status: done
    comment: README section "Available Sensors and Controls".
  docs-troubleshooting:
    status: done
    comment: README section "Troubleshooting".
  docs-use-cases:
    status: done
    comment: README section "Use Cases".
  dynamic-devices:
    status: exempt
    comment: Each config entry is exactly one device; none appear later.
  entity-category:
    status: done
    comment: >-
      Diagnostic and config categories are used (thresholds, RSSI, Bluetooth
      status, pending config, soaping time, comfort temperature, auto sync).
  entity-device-class:
    status: done
    comment: >-
      Every measured sensor has a device class; flow_rate uses
      SensorDeviceClass.VOLUME_FLOW_RATE (liters per minute).
  entity-disabled-by-default:
    status: done
    comment: >-
      The entities that are only useful for support or fine analysis are
      disabled by default: the Bluetooth signal (RSSI) sensor, the cold-water
      duration and the time to comfort. Users can enable them from the entity
      settings. This only applies to new installations: an entity that is
      already registered keeps its current state.
  entity-translations:
    status: done
    comment: All entities use translation_key and has_entity_name.
  exception-translations:
    status: exempt
    comment: The integration raises no user-facing exceptions.
  icon-translations:
    status: done
    comment: >-
      icons.json defines every entity icon (with one icon per state for the
      Bluetooth status sensor); no icon is hard-coded in the Python code, and
      tests/test_icons.py enforces it.
  reconfiguration-flow:
    status: exempt
    comment: >-
      The only connection setting is the Bluetooth address, which is the
      device's identity. Everything else lives in the options flow.
  repair-issues:
    status: exempt
    comment: >-
      No situation needs the user to intervene beyond what the status sensors
      and the options flow already cover; Bluetooth adapter problems belong
      to the Bluetooth integration.
  stale-devices:
    status: exempt
    comment: Each config entry is exactly one device.

  # --- Platinum -------------------------------------------------------------
  async-dependency:
    status: done
    comment: >-
      Bluetooth access goes through bleak and bleak-retry-connector, which are
      asyncio libraries.
  inject-websession:
    status: exempt
    comment: The integration makes no HTTP requests.
  strict-typing:
    status: done
    comment: >-
      The whole integration passes `mypy --strict` with zero errors, enforced
      by the Typing workflow. DataUpdateCoordinator is parametrized and
      HydraoConfigEntry types entry.runtime_data.

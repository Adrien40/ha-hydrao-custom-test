# Keeps the CI and the test tooling up to date.
#
# The integration declares no requirements of its own (bleak and
# bleak-retry-connector come with Home Assistant's Bluetooth integration). The
# bleak pins in requirements-test.txt only exist for the test environment.
version: 2

updates:
  # Actions used by the workflows (checkout, setup-python, ruff-action...).
  # References such as @main or @master (hacs, hassfest) are not versioned
  # tags, so they are left alone.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  # Test requirements. Every pin except mypy is deliberately frozen on what
  # Home Assistant 2026.5.0 declares (see requirements-test.txt and
  # tests/test_compatibility.py): the suite runs on the very release that
  # hacs.json declares as the minimum. They are bumped by hand, together
  # with hacs.json, when the minimum Home Assistant version is raised.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore"
    ignore:
      - dependency-name: "pytest-homeassistant-custom-component"
      - dependency-name: "bleak"
      - dependency-name: "bleak-retry-connector"
      - dependency-name: "bluetooth-adapters"
      - dependency-name: "bluetooth-auto-recovery"
      - dependency-name: "bluetooth-data-tools"
      - dependency-name: "dbus-fast"
      - dependency-name: "habluetooth"
      - dependency-name: "aiousbwatcher"
      - dependency-name: "serialx"
      - dependency-name: "aioesphomeapi"
